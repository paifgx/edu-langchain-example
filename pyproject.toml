[project]
name = "support-copilot-workshop"
version = "0.1.0"
description = "Dependencies for Support Copilot Übungen 01–04 (LangChain, Agents, RAG, Betrieb)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=0.3.14",
    "langchain-core>=0.3.14",
    "langchain-openai>=0.2.14",
    "langchain-community>=0.3.14",
    "langgraph>=0.2.55",
    "pydantic>=2.7",
    "python-dotenv>=1.0.1",
    "langsmith>=0.1.99",
    "faiss-cpu>=1.8.0",
    "chromadb>=0.5.15",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

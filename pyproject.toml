[project]
name = "support-copilot-snippets"
version = "0.1.0"
description = "Musterlösung Übung 01 — Support Copilot Fundament (LangChain 1.2.x)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.0,<2",
    "langchain-core>=1.2.0,<2",
    "langchain-openai>=1.0.0,<2",
    "pydantic>=2.7",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
